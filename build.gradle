buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'org.teavm:org.teavm.gradle.plugin:0.15.0'
    }
}

apply plugin: 'java'
apply plugin: 'war'
apply plugin: 'org.teavm'

group = 'com.eaglercraft'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.teavm:teavm-jso-apis:0.15.0'

    // Guava (used extensively by MC)
    implementation 'com.google.guava:guava:31.1-jre'
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    // FastUtil
    implementation 'it.unimi.dsi:fastutil:8.5.11'
    // Netty
    implementation 'io.netty:netty-all:4.1.82.Final'
    // SLF4J
    implementation 'org.slf4j:slf4j-api:1.7.36'
    // Apache Commons
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    // JNA (needed by some MC classes, mostly stubbed)
    implementation 'net.java.dev.jna:jna:5.12.1'
    implementation 'net.java.dev.jna:jna-platform:5.12.1'
    // ICU4J
    implementation 'com.ibm.icu:icu4j:72.1'
    // OSHI
    implementation 'com.github.oshi:oshi-core:6.3.2'
    // JSR-305 annotations
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // JetBrains annotations
    implementation 'org.jetbrains:annotations:24.0.0'
    // JOpt Simple (command line parsing, used by main class)
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

teavm {
    all {
        mainClass = 'com.eaglercraft.Main'
        debugInformation = true
    }
    wasmGC {
        addedToWebApp = true
        targetFileName = 'game.wasm'
        copyRuntime = true
        strict = true
        obfuscated = false
        minDirectBuffersSize = 4
    }
}

tasks.named('generateWasmGC') {
    dependsOn classes
}

task assembleWebApp(type: Copy, dependsOn: ['generateWasmGC', 'copyWasmGCRuntime']) {
    from('src/main/resources/webapp') {
        exclude 'wasm-gc'
    }
    from('build/generated/teavm/wasm-gc') {
        into 'wasm-gc'
    }
    into layout.buildDirectory.dir('webapp')
}

task devServer(type: Exec, dependsOn: assembleWebApp) {
    commandLine 'cmd', '/c', 'start', 'cmd', '/c',
        "cd /d \"${layout.buildDirectory.get().asFile}/webapp\" && python -m http.server 8080"
}
